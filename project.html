<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>프로젝트 상세 — 금석조경</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --forest:#1e3d1a;--moss:#3a6b34;--fern:#5a8f4a;--sage:#8cb87a;
  --mist:#c8ddc0;--parch:#f7f2ea;--paper:#fdfaf4;--stone:#8a8278;--ink:#1c1a17;
}
  
html{scroll-behavior:smooth;}
body{font-family:'Pretendard',sans-serif;background:var(--paper);color:var(--ink);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:20px 64px;display:flex;align-items:center;justify-content:space-between;background:rgba(253,250,244,0.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(90,143,74,0.12);}
.nav-logo{font-size:1.3rem;font-weight:700;color:var(--forest);text-decoration:none;letter-spacing:0.02em;}
.nav-logo span{color:var(--sage);}
.nav-back{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:0.85rem;color:var(--stone);transition:color 0.2s;}
.nav-back:hover{color:var(--forest);}

/* HERO */
.proj-hero{width:100%;aspect-ratio:16/7;overflow:hidden;background:#e8e4dc;margin-top:64px;}
.proj-hero img{width:100%;height:100%;object-fit:cover;}
.proj-hero-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:0.2;background:linear-gradient(135deg,var(--forest),var(--moss));}

/* CONTENT */
.proj-wrap{max-width:800px;margin:0 auto;padding:60px 40px 100px;}

.proj-meta{font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--fern);margin-bottom:16px;}
.proj-title{font-size:clamp(2rem,5vw,3rem);font-weight:700;color:var(--forest);line-height:1.2;margin-bottom:40px;letter-spacing:-0.02em;}

.proj-body{font-size:1rem;line-height:1.95;color:#4a4030;}
.proj-body img{width:100%;border-radius:8px;margin:28px 0;display:block;}
.proj-body h2{font-size:1.5rem;font-weight:700;color:var(--forest);margin:40px 0 16px;letter-spacing:-0.01em;}
.proj-body h3{font-size:1.15rem;font-weight:600;color:var(--forest);margin:32px 0 12px;}
.proj-body p{margin:12px 0;}
.proj-body ul,
.proj-body ol{padding-left:24px;margin:12px 0;}
.proj-body li{margin:6px 0;}
.proj-body strong{font-weight:600;color:var(--ink);}

/* DIVIDER */
.proj-divider{width:40px;height:2px;background:var(--fern);margin:60px 0;}

/* OTHER PROJECTS */
.other-title{font-size:1.2rem;font-weight:700;color:var(--forest);margin-bottom:28px;letter-spacing:-0.01em;}
.other-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.other-card{border-radius:8px;overflow:hidden;cursor:pointer;background:#e8e4dc;transition:transform 0.3s,box-shadow 0.3s;}
.other-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(30,61,26,0.12);}
.other-card-img{aspect-ratio:4/3;overflow:hidden;}
.other-card-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s;}
.other-card:hover .other-card-img img{transform:scale(1.05);}
.other-card-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:0.25;}
.other-card-info{padding:14px 16px;background:white;}
.other-card-tag{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--fern);margin-bottom:4px;}
.other-card-title{font-size:0.92rem;font-weight:600;color:var(--forest);}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;gap:12px;color:var(--stone);}
.spinner{width:24px;height:24px;border:2px solid var(--mist);border-top-color:var(--fern);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  nav{padding:16px 24px;}
  .proj-wrap{padding:40px 24px 80px;}
  .other-grid{grid-template-columns:1fr 1fr;}
  .proj-hero{aspect-ratio:4/3;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">금석<span>조경</span></a>
  <a href="index.html#portfolio" class="nav-back">← 프로젝트 목록</a>
</nav>

<div id="app">
  <div class="loading"><div class="spinner"></div> 불러오는 중...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDD6CVdV3JfzjdOtyusbD1I7yCpZ59_Cpw",
  authDomain: "gsstone.firebaseapp.com",
  projectId: "gsstone",
  storageBucket: "gsstone.firebasestorage.app",
  messagingSenderId: "125014531671",
  appId: "1:125014531671:web:5cd9324391874e07820d12"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getFirstImage(body) {
  const div = document.createElement('div');
  div.innerHTML = body || '';
  const img = div.querySelector('img');
  return img ? img.src : null;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { location.href = 'index.html'; return; }

  try {
    // 현재 프로젝트
    const docSnap = await getDoc(doc(db, 'projects', id));
    if (!docSnap.exists()) { location.href = 'index.html'; return; }
    const p = { id: docSnap.id, ...docSnap.data() };

    // 히어로 이미지: 본문 첫 번째 이미지 우선
    const heroImg = getFirstImage(p.body) || p.coverUrl || null;

    // 전체 프로젝트 (다른 프로젝트 목록용)
    const q = query(collection(db, 'projects'), orderBy('createdAt', 'desc'));
    const allSnap = await getDocs(q);
    const others = allSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(x => x.id !== id)
      .slice(0, 3);

    // 페이지 타이틀
    document.title = `${p.title} — 금석조경`;

    // 렌더링
    document.getElementById('app').innerHTML = `
      <!-- CONTENT -->
      <div class="proj-wrap" style="padding-top:100px">
        <div class="proj-meta">${p.category} · ${p.year}년${p.location ? ' · ' + p.location : ''}</div>
        <h1 class="proj-title">${p.title}</h1>
        <div class="proj-body">${p.body || '<p>내용이 없습니다.</p>'}</div>

        ${others.length > 0 ? `
          <div class="proj-divider"></div>
          <div class="other-title">다른 프로젝트</div>
          <div class="other-grid">
            ${others.map(o => {
              const thumb = getFirstImage(o.body) || o.coverUrl || null;
              return `
              <div class="other-card" onclick="location.href='project.html?id=${o.id}'">
                <div class="other-card-img">
                  ${thumb
                    ? `<img src="${thumb}" alt="${o.title}" loading="lazy"/>`
                    : `<div class="other-card-img-ph">🌿</div>`}
                </div>
                <div class="other-card-info">
                  <div class="other-card-tag">${o.category} · ${o.year}</div>
                  <div class="other-card-title">${o.title}</div>
                </div>
              </div>`;
            }).join('')}
          </div>` : ''}
      </div>
    `;
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="loading">프로젝트를 불러오는 중 오류가 발생했습니다.</div>`;
  }
}

init();
</script>
</body>
</html>
